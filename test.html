<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="apple-touch-icon" href="/asset/img/1.png" />
    <title>Mazorya Group — URL Redirect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: #0a0a0f;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 180, 255, 0.12) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        /* ===== Top bar: logo left, brand name right ===== */
        .topbar {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 4px;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: linear-gradient(135deg, #7c5cff 0%, #00b4ff 100%);
            box-shadow: 0 6px 20px rgba(124, 92, 255, 0.35);
            flex-shrink: 0;
        }

        .logo svg {
            width: 26px;
            height: 26px;
        }

        .brand {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #7c5cff 0%, #00b4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            white-space: nowrap;
        }

        /* ===== Main content centered ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #14141c;
            border: 1px solid #23232f;
            border-radius: 16px;
            padding: 32px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #7c5cff 0%, #00b4ff 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: #fff;
            font-size: 26px;
            box-shadow: 0 8px 24px rgba(124, 92, 255, 0.35);
        }

        h1 {
            color: #f5f5fa;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        p {
            color: #8a8a9a;
            font-size: 13px;
            margin-bottom: 22px;
            line-height: 1.6;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            color: #f5f5fa;
            background: #0d0d14;
            border: 1.5px solid #2a2a38;
            border-radius: 10px;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder {
            color: #4a4a5a;
        }

        input[type="text"]:focus {
            border-color: #7c5cff;
            box-shadow: 0 0 0 4px rgba(124, 92, 255, 0.15);
            background: #0a0a10;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #7c5cff 0%, #00b4ff 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(124, 92, 255, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .error {
            color: #ff5566;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
        }

        .hint {
            font-size: 12px;
            color: #4a4a5a;
            margin-top: 14px;
        }

        /* ===== Mobile responsive ===== */
        @media (max-width: 480px) {
            .topbar {
                margin-bottom: 18px;
                padding: 6px 2px;
            }

            .logo {
                width: 40px;
                height: 40px;
                border-radius: 10px;
            }

            .logo svg {
                width: 22px;
                height: 22px;
            }

            .brand {
                font-size: 15px;
            }

            .card {
                padding: 26px 20px;
                border-radius: 14px;
            }

            .icon {
                width: 54px;
                height: 54px;
                font-size: 22px;
                margin-bottom: 16px;
            }

            h1 {
                font-size: 18px;
            }

            p {
                font-size: 12px;
                margin-bottom: 18px;
            }

            input[type="text"],
            button {
                padding: 13px 14px;
                font-size: 14px;
            }

            .hint {
                font-size: 11px;
            }
        }

        @media (max-width: 360px) {
            .brand {
                font-size: 13px;
            }

            .card {
                padding: 22px 16px;
            }

            h1 {
                font-size: 16px;
            }

            p {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== Top Bar ===== -->
    <header class="topbar">
        <!-- Logo (left) -->
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
                <path d="M2 17l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
                <path d="M2 12l10 5 10-5" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Brand name (right) -->
        <div class="brand">Mazorya Group</div>
    </header>

    <!-- ===== Main Card ===== -->
    <main class="main">
        <div class="card">
            <div class="icon">&#128279;</div>
            <h1>Redirect to URL</h1>
            <p>Enter the destination address below and you'll be redirected instantly.</p>

            <div class="input-group">
                <input
                    type="text"
                    id="urlInput"
                    placeholder="https://example.com"
                    autocomplete="off"
                    spellcheck="false"
                    autofocus
                >
            </div>

            <button onclick="redirectTo()">Go to URL</button>
            <div class="error" id="errorMsg"></div>
            <div class="hint">Press Enter to redirect</div>
        </div>
    </main>

    <script>
        function redirectTo() {
            const input = document.getElementById('urlInput');
            const errorMsg = document.getElementById('errorMsg');
            let url = input.value.trim();

            errorMsg.textContent = '';

            if (!url) {
                errorMsg.textContent = 'Please enter a URL.';
                return;
            }

            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            try {
                new URL(url);
            } catch (e) {
                errorMsg.textContent = 'Invalid URL. Please check and try again.';
                return;
            }

            window.location.href = url;
        }

        document.getElementById('urlInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                redirectTo();
            }
        });
    </script>

</body>
</html>
